apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-generator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lucasdamasceno96/devex-microservices-idp
    targetRevision: main
    path: platform/helm-chart
    helm:
      values: |
        image:
          repository: us-central1-docker.pkg.dev/ldp21k-labs/devex-idp/service-generator
          tag: latest
        replicaCount: 1
        environment:
          NODE_ENV: "development"
          LOG_LEVEL: "debug"
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
