apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-portal-dev
  namespace: argocd
  labels:
    team: platform-team
    environment: dev
    generated-by: idp-portal
spec:
  project: default
  source:
    repoURL: https://github.com/lucasdamasceno96/devex-microservices-idp
    targetRevision: main
    path: platform/helm-chart
    helm:
      values: |
        image:
          repository: us-central1-docker.pkg.dev/ldp21k-labs/devex-idp/idp-portal
          tag: latest
          pullPolicy: Always
        replicaCount: 1
        service:
          port: 8501
        probes:
          liveness:
            path: /_stcore/health
            initialDelaySeconds: 30
            periodSeconds: 15
          readiness:
            path: /_stcore/health
            initialDelaySeconds: 10
            periodSeconds: 10
        resources:
          requests:
            cpu: 512m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        environment:
          NODE_ENV: "development"
          LOG_LEVEL: "debug"
        autoscaling:
          enabled: false
        otel:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
